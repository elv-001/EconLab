[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-sim"
version = "1.0.0"
description = "Agent-based economic simulation: specialization, trade, and wealth distribution"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sim = "sim.run:main"

[tool.setuptools.packages.find]
where = ["src"]
